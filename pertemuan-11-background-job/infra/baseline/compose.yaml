name: pbe11-baseline
services:
  postgres:
    image: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    container_name: pbe11-baseline-postgres
    ports: ["127.0.0.1:55411:5432"]
    environment:
      POSTGRES_USER: pbe11_admin
      POSTGRES_DB: pertemuan11_test
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin
    secrets: [pg_admin]
    volumes: ["postgres_data:/var/lib/postgresql"]
    networks: [baseline]
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbe11_admin -d pertemuan11_test"]
      interval: 5s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    container_name: pbe11-baseline-mongo
    ports: ["127.0.0.1:27111:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pbe11_admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_admin
    secrets: [mongo_admin, mongo_app]
    volumes: ["mongo_data:/data/db"]
    tmpfs: ["/data/configdb"]
    networks: [baseline]
    mem_limit: 768m
    cpus: 1.0
    restart: "no"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    container_name: pbe11-baseline-redis
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "/run/secrets/redis_config"]
    secrets: [redis_config]
    volumes: ["redis_data:/data"]
    networks: [baseline]
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /run/secrets/redis_config); redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  baseline:
    name: pbe11-baseline-network
volumes:
  postgres_data:
    name: pbe11-baseline-postgres-data
  mongo_data:
    name: pbe11-baseline-mongo-data
  redis_data:
    name: pbe11-baseline-redis-data
secrets:
  pg_admin:
    file: .secrets/pg-admin-password
  mongo_admin:
    file: .secrets/mongo-admin-password
  mongo_app:
    file: .secrets/mongo-app-password
  redis_config:
    file: .secrets/redis.conf
